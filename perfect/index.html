<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prime Colours</title>
  <script>
    (function () {
      try {
        fetch('/api/method/goldretail.api.system.get_system_status')
          .then(function (r) { return r.json(); })
          .then(function (data) {
            var state = data.message || data;
            if (state && state.is_down) {
              if (state.redirect_url) {
                var target = state.redirect_url;
                var targetUrl = (target.startsWith('http://') || target.startsWith('https://') || target.startsWith('/'))
                  ? target
                  : '/' + target;
                if (window.location.href !== targetUrl && window.location.pathname !== targetUrl) {
                  window.location.replace(targetUrl);
                  return;
                }
              }
              var el = document.getElementById('pre-hydration-system-down');
              if (!el) {
                el = document.createElement('div');
                el.id = 'pre-hydration-system-down';
                el.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:99999999;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden;';
                if (state.image_url) {
                  var img = document.createElement('img');
                  img.src = state.image_url;
                  img.alt = 'System Down';
                  img.style.cssText = 'max-width:100%;max-height:100%;object-fit:contain;';
                  el.appendChild(img);
                }
                document.body.appendChild(el);
              }
            }
          })
          .catch(function (e) { console.error(e); });
      } catch (e) { }
    })();
  </script>
  <script>
    window.csrf_token = '{{ frappe.session.csrf_token }}';
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
